<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our TV</title>
<style>
:root{--bg:#06121c;--card:#0f1d2a;--line:rgba(255,255,255,.1);--ink:#f5f2ec;--dim:rgba(245,242,236,.66);--acc:#38e0c8;--bad:#ff7a6b}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 600px at 10% -10%,#0f4a48,transparent 70%),radial-gradient(900px 700px at 110% 10%,#123a8a,transparent 70%),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:28px 18px 60px}
.brand{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.brand b{letter-spacing:.3em;font-weight:300;font-size:18px}
.brand button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:20px;padding:6px 14px;font:inherit}
h2{font-size:15px;font-weight:600;color:var(--dim);margin:28px 0 10px;text-transform:uppercase;letter-spacing:.06em}
[dir=rtl] h2{text-transform:none;letter-spacing:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
input,select,textarea{width:100%;background:#0a1621;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font:inherit;margin:6px 0}
button.main{width:100%;background:var(--ink);color:#06121c;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:600;margin-top:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-child{border:0}
.person .n{flex:1;font-weight:600}
.seg{display:flex;background:#0a1621;border-radius:12px;padding:3px}
.seg button{flex:1;background:none;border:0;color:var(--dim);padding:8px 6px;border-radius:9px;font:inherit;font-size:14px}
.seg button.on{background:var(--ink);color:#06121c;font-weight:600}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item small{color:var(--dim)}
.x{background:none;border:0;color:var(--bad);font-size:20px}
.adj{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;margin:6px 0}
.adj button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#0a1621;color:var(--ink);font-size:18px}
.adj span{min-width:44px;text-align:center}
.msg{color:var(--acc);min-height:22px;margin-top:8px}
.err{color:var(--bad)}
.hide{display:none}
label.file{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;color:var(--dim)}
label.file input{display:none}
</style>
</head>
<body>
<main id="app">
  <div class="brand"><b id="brand">OUR TV</b><button id="lang">العربية</button></div>
  <section id="login" class="card">
    <div data-t="pinTitle"></div>
    <input id="pin" inputmode="numeric" maxlength="4" autocomplete="off">
    <button class="main" id="go" data-t="enter"></button>
    <div class="msg err" id="loginMsg"></div>
  </section>
  <div id="panel" class="hide">
    <h2 data-t="pictures"></h2><div class="card"><div id="people"></div>
      <div id="addBox" style="margin-top:10px"><div class="row"><input id="newEn" data-p="enP"><input id="newAr" data-p="arP" dir="rtl"></div>
      <button class="main" id="addPerson" data-t="addP"></button></div></div>
    <h2 data-t="memories"></h2>
    <div class="card">
      <div class="row"><select id="mby"></select><input id="mdate" type="date"></div>
      <input id="mcap" data-p="mcapP">
      <label class="file" style="display:block;text-align:center;padding:13px;margin-top:6px;background:var(--ink);color:#06121c;font-weight:600"><span data-t="mAdd"></span><input type="file" accept="image/*" multiple id="mfiles"></label>
      <div class="msg" id="mprog"></div>
      <div id="mgrid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"></div>
    </div>
    <h2 data-t="dates"></h2>
    <div class="card">
      <div id="events"></div>
      <div class="seg" id="kind"><button data-k="birthday" class="on" data-t="birthday"></button><button data-k="occasion" data-t="occasion"></button></div>
      <select id="who"></select>
      <input id="title" data-p="titleP">
      <div class="row"><input id="day" type="number" min="1" max="31" data-p="dayP"><input id="month" type="number" min="1" max="12" data-p="monthP"><input id="year" type="number" data-p="yearP"></div>
      <button class="main" id="addEvent" data-t="add"></button>
    </div>
    <h2 data-t="notes"></h2>
    <div class="card"><div id="notes"></div><textarea id="note" rows="2" data-p="noteP"></textarea><button class="main" id="addNote" data-t="send"></button></div>
    <h2 data-t="prayer"></h2>
    <div class="card"><div id="adj"></div>
      <div class="adj"><span data-t="hijri" style="text-align:start"></span><button data-h="-1">−</button><span id="hv"></span><button data-h="1">+</button></div>
      <button class="main" id="savePrayer" data-t="save"></button></div>
    <h2 data-t="celebrate"></h2>
    <div class="card"><select id="cwho"></select>
      <div class="row"><button class="main" data-c="birthday" data-t="birthday"></button><button class="main" data-c="ramadan" data-t="ramadanB"></button><button class="main" data-c="fitr" data-t="eidB"></button></div></div>
    <h2 data-t="mood"></h2>
    <div class="card"><div class="seg" id="mood"></div>
      <div class="row" style="margin-top:12px;align-items:center"><label class="file" style="text-align:center"><span data-t="wallUp"></span><input type="file" accept="image/*" id="wall"></label>
      <button class="main hide" id="wallDel" data-t="wallDel" style="margin-top:0"></button></div></div>
    <div class="msg" id="msg"></div>
    <p style="text-align:center;margin-top:24px"><a href="/sync" style="color:var(--dim)">Mirroring sound test · اختبار صوت العرض</a></p>
  </div>
</main>
<script>
const T={en:{pinTitle:'Enter the 4-digit PIN shown on the TV',enter:'Continue',pictures:'Pictures',dates:'Birthdays and occasions',birthday:'Birthday',occasion:'Occasion',titleP:'Occasion name',dayP:'Day',monthP:'Month',yearP:'Year (optional)',add:'Add',notes:'Notes for the family',noteP:'Dinner at 8',send:'Show on TV',prayer:'Prayer times',hijri:'Hijri date',save:'Save',mood:'Mood',avatar:'Avatar',letter:'Letter',photo:'Photo',upload:'Upload photo',saved:'Saved on the TV',wrong:'Wrong PIN',min:'min',moods:['Aurora','Sunset','Graphite','Auto','Photo'],prayers:['Fajr','Sunrise','Dhuhr','Asr','Maghrib','Isha'],all:'Whole family',celebrate:'See it on the TV',ramadanB:'Ramadan',eidB:'Eid',wallUp:'Background photo',wallDel:'Remove photo',memories:'Memories',mcapP:'Caption (optional), e.g. Eid at grandma\'s',mAdd:'Add photos',mUp:'Sending',mOf:'of',mEdit:'New caption',mDel:'Delete this photo?',mNone:'No photos yet',enP:'Name in English',arP:'الاسم بالعربية',addP:'Add a person',renEn:'Name in English',renAr:'Name in Arabic',delP:'Remove {n}? Their picture, apps and settings on the TV will be deleted.'},
ar:{pinTitle:'أدخل الرقم السري الظاهر على التلفاز',enter:'متابعة',pictures:'الصور',dates:'أعياد الميلاد والمناسبات',birthday:'عيد ميلاد',occasion:'مناسبة',titleP:'اسم المناسبة',dayP:'اليوم',monthP:'الشهر',yearP:'السنة (اختياري)',add:'إضافة',notes:'رسائل للعائلة',noteP:'العشاء الساعة 8',send:'اعرض على التلفاز',prayer:'مواقيت الصلاة',hijri:'التاريخ الهجري',save:'حفظ',mood:'الأجواء',avatar:'شخصية',letter:'حرف',photo:'صورة',upload:'رفع صورة',saved:'تم الحفظ على التلفاز',wrong:'الرقم السري غير صحيح',min:'د',moods:['الشفق','الغروب','جرافيت','تلقائي','صورة'],prayers:['الفجر','الشروق','الظهر','العصر','المغرب','العشاء'],all:'كل العائلة',celebrate:'شاهدها على التلفاز',ramadanB:'رمضان',eidB:'العيد',wallUp:'صورة الخلفية',wallDel:'إزالة الصورة',memories:'الذكريات',mcapP:'وصف (اختياري)، مثل: العيد عند جدتي',mAdd:'إضافة صور',mUp:'جارٍ الإرسال',mOf:'من',mEdit:'وصف جديد',mDel:'حذف هذه الصورة؟',mNone:'لا توجد صور بعد',enP:'Name in English',arP:'الاسم بالعربية',addP:'إضافة شخص',renEn:'الاسم بالإنجليزية',renAr:'الاسم بالعربية',delP:'إزالة {n}؟ ستُحذف صورته وتطبيقاته وإعداداته من التلفاز.'}};
const KEYS=['fajr','sunrise','dhuhr','asr','maghrib','isha'];
let lang=localStorage.getItem('lang')||'en',pin=sessionStorage.getItem('pin')||'',st=null,kind='birthday',adj={},hij=0;
const $=id=>document.getElementById(id),t=k=>T[lang][k];
function paint(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').textContent=lang==='ar'?'English':'العربية';
 document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=t(e.dataset.p));if(st)draw()}
async function api(body){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({pin},body))});
 if(r.status===403){sessionStorage.removeItem('pin');$('panel').classList.add('hide');$('login').classList.remove('hide');$('loginMsg').textContent=t('wrong');throw 0}
 st=await r.json();draw();return st}
function say(){$('msg').textContent=t('saved');setTimeout(()=>$('msg').textContent='',2200)}
function draw(){const nm=i=>st.people[i][lang];if(st.brand){$('brand').textContent=st.brand;document.title=st.brand}
 const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 $('addBox').classList.toggle('hide',st.people.length>=(st.maxPeople||8));
 $('people').innerHTML=st.people.map((p,i)=>`<div class="person"><div class="n">${esc(nm(i))}<br>
  <button class="x" data-ren="${i}" style="color:var(--dim);font-size:15px;padding:0">✎</button>${st.people.length>1?` <button class="x" data-rm="${i}" style="font-size:15px;padding:0 0 0 10px">✕</button>`:''}</div><div><div class="seg" data-i="${i}">${['avatar','letter','photo'].map(m=>`<button data-m="${m}" class="${p.pic===m?'on':''}" ${m==='photo'&&!p.hasPhoto?'disabled style="opacity:.35"':''}>${t(m)}</button>`).join('')}</div>
  <label class="file" style="margin-top:6px">${t('upload')}<input type="file" accept="image/*" data-i="${i}"></label></div></div>`).join('');
 $('who').innerHTML=st.people.map((p,i)=>`<option value="${i}">${nm(i)}</option>`).join('');
 const cw=$('cwho').value;$('cwho').innerHTML=$('who').innerHTML;if(cw)$('cwho').value=cw;
 const mb=$('mby').value;$('mby').innerHTML=$('who').innerHTML;if(mb)$('mby').value=mb;
 const mem=(st.memories||[]).slice().reverse();
 $('mgrid').innerHTML=mem.length?mem.map(m=>`<div style="position:relative"><img data-mf="${m.file}" src="/memory/${m.file}?pin=${pin}" loading="lazy" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block">
  <button class="x" data-md="${m.file}" style="position:absolute;top:2px;inset-inline-end:2px;background:rgba(0,0,0,.55);border-radius:50%;width:30px;height:30px;font-size:18px;line-height:1">×</button></div>`).join(''):`<small style="color:var(--dim)">${t('mNone')}</small>`;
 $('who').classList.toggle('hide',kind!=='birthday');$('title').classList.toggle('hide',kind==='birthday');
 $('events').innerHTML=st.events.map((e,i)=>`<div class="item"><div>${e.kind==='birthday'&&e.who>=0?t('birthday')+' · '+nm(e.who):e.title}<br><small>${e.date}</small></div><button class="x" data-ev="${i}">×</button></div>`).join('');
 $('notes').innerHTML=st.notes.map((n,i)=>`<div class="item"><div>${n.text.replace(/</g,'&lt;')}</div><button class="x" data-no="${i}">×</button></div>`).join('');
 adj=Object.assign({},st.adj);hij=st.hijri;drawAdj();
 $('mood').innerHTML=t('moods').slice(0,st.hasWall?5:4).map((m,i)=>`<button data-mo="${i}" class="${st.mood===i?'on':''}">${m}</button>`).join('');
 $('wallDel').classList.toggle('hide',!st.hasWall)}
function drawAdj(){$('adj').innerHTML=KEYS.map((k,i)=>`<div class="adj"><span style="text-align:start">${t('prayers')[i]}</span><button data-a="${k}" data-d="-1">−</button><span>${adj[k]>0?'+':''}${adj[k]} ${t('min')}</span><button data-a="${k}" data-d="1">+</button></div>`).join('');$('hv').textContent=(hij>0?'+':'')+hij}
function resize(file){return new Promise((ok,bad)=>{const img=new Image();img.onload=()=>{const s=Math.min(img.width,img.height),c=document.createElement('canvas');c.width=c.height=512;
 c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,512,512);ok(c.toDataURL('image/jpeg',.86).split(',')[1])};img.onerror=bad;img.src=URL.createObjectURL(file)})}
document.addEventListener('click',async e=>{
 const im=e.target.closest('img[data-mf]');
 if(im){const c=prompt(t('mEdit'));if(c!==null){await api({action:'editMemory',file:im.dataset.mf,caption:c});say()}return}
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='addPerson'){const en=$('newEn').value.trim(),ar=$('newAr').value.trim();if(!en&&!ar)return;
  await api({action:'addPerson',en:en||ar,ar:ar||en});$('newEn').value='';$('newAr').value='';return say()}
 if(b.dataset.ren){const i=+b.dataset.ren,p=st.people[i];const en=prompt(t('renEn'),p.en);if(en===null)return;const ar=prompt(t('renAr'),p.ar);if(ar===null)return;
  await api({action:'renamePerson',who:i,en:en||ar,ar:ar||en});return say()}
 if(b.dataset.rm){const i=+b.dataset.rm;if(!confirm(t('delP').replace('{n}',st.people[i][lang])))return;await api({action:'removePerson',who:i});return say()}
 if(b.dataset.md){if(confirm(t('mDel'))){await api({action:'delMemory',file:b.dataset.md});say()}return}
 if(b.id==='lang'){lang=lang==='ar'?'en':'ar';localStorage.setItem('lang',lang);return paint()}
 if(b.id==='go'){pin=$('pin').value.trim();try{await api({action:'state'});sessionStorage.setItem('pin',pin);$('login').classList.add('hide');$('panel').classList.remove('hide');$('loginMsg').textContent=''}catch(_){}return}
 if(b.dataset.k){kind=b.dataset.k;document.querySelectorAll('#kind button').forEach(x=>x.classList.toggle('on',x===b));return draw()}
 if(b.dataset.m){await api({action:'picture',who:+b.parentNode.dataset.i,mode:b.dataset.m});return say()}
 if(b.dataset.ev){await api({action:'delEvent',index:+b.dataset.ev});return say()}
 if(b.dataset.no){await api({action:'delNote',index:+b.dataset.no});return say()}
 if(b.dataset.a){adj[b.dataset.a]=Math.max(-30,Math.min(30,adj[b.dataset.a]+ +b.dataset.d));return drawAdj()}
 if(b.dataset.h){hij=Math.max(-2,Math.min(2,hij+ +b.dataset.h));return drawAdj()}
 if(b.id==='wallDel'){await api({action:'wallpaperRemove'});return say()}
 if(b.dataset.c){await api({action:'celebrate',kind:b.dataset.c,who:+$('cwho').value});return say()}
 if(b.dataset.mo){await api({action:'mood',mood:+b.dataset.mo});return say()}
 if(b.id==='savePrayer'){await api({action:'prayer',adj,hijri:hij,islamicDates:true});return say()}
 if(b.id==='addNote'){const v=$('note').value.trim();if(!v)return;await api({action:'addNote',text:v});$('note').value='';return say()}
 if(b.id==='addEvent'){const d=+$('day').value,m=+$('month').value,y=$('year').value.trim();if(!d||!m)return;
  const date=(y?y+'-':'')+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  await api({action:'addEvent',kind,who:kind==='birthday'?+$('who').value:-1,title:$('title').value,date});['day','month','year','title'].forEach(i=>$(i).value='');return say()}});
// A memory keeps its whole picture, no larger than the TV's screen.
function resizeMax(file){return new Promise((ok,bad)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1920/img.width,1920/img.height),c=document.createElement('canvas');
 c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};img.onerror=bad;img.src=URL.createObjectURL(file)})}
// A background photo is cropped to fill the TV (1920×1080), not to a square.
function resizeWall(file){return new Promise((ok,bad)=>{const img=new Image();img.onload=()=>{const W=1920,H=1080,s=Math.max(W/img.width,H/img.height),c=document.createElement('canvas');c.width=W;c.height=H;
 const w=W/s,h=H/s;c.getContext('2d').drawImage(img,(img.width-w)/2,(img.height-h)/2,w,h,0,0,W,H);ok(c.toDataURL('image/jpeg',.85).split(',')[1])};img.onerror=bad;img.src=URL.createObjectURL(file)})}
document.addEventListener('change',async e=>{if(e.target.type!=='file'||!e.target.files[0])return;
 if(e.target.id==='mfiles'){
  // One photo per request, so a big album never hits the TV's size limit; each keeps its own date.
  const files=[...e.target.files];let i=0;
  for(const f of files){i++;$('mprog').textContent=`${t('mUp')} ${i} ${t('mOf')} ${files.length}…`;
   const d=$('mdate').value||new Date(f.lastModified).toISOString().slice(0,10);
   await api({action:'addMemory',data:await resizeMax(f),caption:$('mcap').value,date:d,by:+$('mby').value})}
  $('mprog').textContent='';e.target.value='';$('mcap').value='';return say()}
 if(e.target.id==='wall'){await api({action:'wallpaper',data:await resizeWall(e.target.files[0])});e.target.value='';return say()}
 const data=await resize(e.target.files[0]);await api({action:'photo',who:+e.target.dataset.i,data});say()});
paint();if(pin){api({action:'state'}).then(()=>{$('login').classList.add('hide');$('panel').classList.remove('hide')}).catch(()=>{})}
</script>
</body>
</html>
